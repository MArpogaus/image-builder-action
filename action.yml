# References:
# https://github.com/ublue-os/image-template/blob/30dd5f507fdd88236775ccb4e3a7f719c01675b1/.github/workflows/build.yml
# https://github.com/secureblue/secureblue/blob/01b1830ee07cbafd15e5558f3a7e58b59143c4fa/.github/workflows/build-one-recipe.yml

name: Image Builder
description: Build, push, and sign container images with SLSA-ready outputs
inputs:
  image-name:
    description: Name of the image
    required: true
  containerfile:
    description: Path to the Containerfile
    required: true
  context:
    description: Build context directory
    required: false
    default: .
  platform:
    description: Target platform (e.g., linux/amd64)
    required: true
  slsa-verify-source:
    description: Optional source URI for SLSA verification
    required: false
    default: ''
  signing-secret:
    description: The cosign private key for signing
    required: true
  registry:
    description: The registry to push to
    required: false
    default: ghcr.io/${{ github.repository_owner }}
  free-disk-space:
    description: Maximize build space
    required: false
    default: true
  cosign-public-key:
    description: Public key content or URL to verify the base image cosign signature
    required: false
    default: ''
  build-args:
    description: Build arguments to pass to the container build (newline-separated KEY=VALUE)
    required: false
    default: ''
  overwrite-ref-tag:
    description: Replace {{branch}} in auto-generated tags with this value (e.g., '31' → ':31', ':31-<sha>')
    required: false
    default: ''
  latest-tag:
    description: Also publish :latest from the default branch. A version matrix sets it for its highest version only
    required: false
    default: 'true'

outputs:
  full-image-ref:
    description: The full image reference with tag
    value: ${{ steps.build_image.outputs.image-with-tag }}
  image-digest:
    description: The image digest
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
  - name: Maximize build space
    if: ${{ inputs.free-disk-space == 'true' }}
    uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6   # v2.0.0
    with:
      tool-cache: true
      android: true
      dotnet: true
      haskell: true
      large-packages: false
      docker-images: false
      swap-storage: true

  - name: Install slsa-verifier
    if: ${{ inputs.slsa-verify-source != '' }}
    uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6   # v2.7.1

  # Always: the base digest becomes a label, so a caller can tell whether a
  # rebuild would change anything.
  - name: Resolve base image
    id: resolve-base
    shell: bash
    env:
      CONTAINERFILE: ${{ inputs.containerfile }}
      BUILD_ARGS: ${{ inputs.build-args }}
    run: |
      set -exuo pipefail

      # The last non-scratch FROM is the base image. A multi-stage file whose
      # final stage is `FROM builder` hands a stage name to skopeo; name the
      # real base in that stage instead, or do not use this action for it.
      RAW_BASE=$(grep -E '^FROM\s+' "${CONTAINERFILE}" | grep -vE '\bscratch\b' | tail -1 | awk '{print $2}')
      if [ -z "$RAW_BASE" ]; then
        echo "No base image found to verify" >&2
        exit 1
      fi

      if [ -n "${BUILD_ARGS}" ]; then
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          RAW_BASE="${RAW_BASE//\$\{$key\}/$value}"
          RAW_BASE="${RAW_BASE//\$$key/$value}"
        done <<< "${BUILD_ARGS}"
      fi

      # skopeo ships in the runner image.
      DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${RAW_BASE}")
      echo "BASE_TAG=${RAW_BASE}" >> "${GITHUB_ENV}"
      echo "BASE_DIGEST=${DIGEST}" >> "${GITHUB_ENV}"

  - name: Install cosign
    if: github.event_name != 'pull_request' || inputs.cosign-public-key != ''
    # v3 line on purpose; see .github/dependabot.yml.
    uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

  - name: Cosign verify base image
    if: ${{ inputs.cosign-public-key != '' }}
    shell: bash
    env:
      COSIGN_PUBLIC_KEY: ${{ inputs.cosign-public-key }}
    run: |
      set -exuo pipefail

      if echo "${COSIGN_PUBLIC_KEY}" | grep -qE '^https?://'; then
        cosign verify --key "${COSIGN_PUBLIC_KEY}" "${BASE_TAG}@${BASE_DIGEST}"
      else
        echo "${COSIGN_PUBLIC_KEY}" > /tmp/cosign.pub
        cosign verify --key /tmp/cosign.pub "${BASE_TAG}@${BASE_DIGEST}"
      fi

  - name: SLSA verify base image
    if: ${{ inputs.slsa-verify-source != '' }}
    shell: bash
    env:
      SOURCE_URI: ${{ inputs.slsa-verify-source }}
    run: |
      set -exuo pipefail

      slsa-verifier verify-image --source-uri "${SOURCE_URI}" "${BASE_TAG}@${BASE_DIGEST}"

  - name: Build tag list for metadata action
    id: tags
    shell: bash
    env:
      OVERWRITE_REF_TAG: ${{ inputs.overwrite-ref-tag }}
    run: |
      set -euo pipefail

      # Without overwrite-ref-tag the branch names the image; with it, the
      # caller's value does, in both the ref tag and the dated ones.
      REF="type=ref,event=branch"
      NAME="{{branch}}"
      if [ -n "${OVERWRITE_REF_TAG}" ]; then
        REF="type=raw,value=${OVERWRITE_REF_TAG}"
        NAME="${OVERWRITE_REF_TAG}"
      fi

      {
        echo 'tags<<TAGEOF'
        echo "${REF}"
        echo 'type=ref,event=pr'
        echo 'type=semver,pattern={{version}}'
        echo 'type=semver,pattern={{major}}.{{minor}}'
        echo "type=raw,value=latest,enable=${{ inputs.latest-tag == 'true' && github.ref_name == github.event.repository.default_branch }}"
        echo "type=raw,value=${NAME}-{{sha}},enable=${{ github.event_name != 'pull_request' }}"
        echo "type=raw,value=${NAME}-{{date 'YYYYMMDD-HHmmss'}},enable=${{ github.event_name != 'pull_request' }}"
        echo 'TAGEOF'
      } >> "${GITHUB_OUTPUT}"

  - name: Extract metadata (tags, labels) for Docker
    id: meta
    uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
    with:
      images: ${{ inputs.registry }}/${{ inputs.image-name }}
      tags: ${{ steps.tags.outputs.tags }}
      labels: |
        org.opencontainers.image.created={{date 'YYYYMMDD-HHmmss'}}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.containerfile }}
        org.opencontainers.image.vendor=${{ github.repository_owner }}
        org.opencontainers.image.url=${{ github.event.repository.html_url }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.base.name=${{ env.BASE_TAG }}
        org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}

  - name: Build Image
    id: build_image
    uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034   # v3.1.0
    with:
      containerfiles: ${{ inputs.containerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platform }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      build-args: ${{ inputs.build-args }}
      oci: true
      layers: true

  - name: Push To Registry
    id: push
    if: github.event_name != 'pull_request'
    uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37   # v3.0.0
    with:
      image: ${{ steps.build_image.outputs.image }}
      tags: ${{ steps.build_image.outputs.tags }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  # After the push, not before: push-to-registry authenticates itself, while
  # cosign needs credentials in the docker config to push signatures.
  - name: Log in to the Container registry
    if: github.event_name != 'pull_request'
    uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
    with:
      registry: ${{ inputs.registry }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  - name: Sign container image
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
      DIGEST: ${{ steps.push.outputs.digest }}
      COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
    run: |
      set -exuo pipefail

      # One signature per digest, not per tag: every tag this job pushed points
      # at the same digest, and cosign stores the signature under the digest.
      cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY \
        "${TAGS%%$'\n'*}@${DIGEST}"

  - name: Verify container image
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
      DIGEST: ${{ steps.push.outputs.digest }}
    run: |
      set -exuo pipefail

      # By digest, so a tag another job moved in between cannot fail this.
      # The caller's checkout must hold the public key that matches signing-secret.
      cosign verify --key cosign.pub "${TAGS%%$'\n'*}@${DIGEST}"
