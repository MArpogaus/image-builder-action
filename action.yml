# References:
# https://github.com/ublue-os/image-template/blob/30dd5f507fdd88236775ccb4e3a7f719c01675b1/.github/workflows/build.yml
# https://github.com/secureblue/secureblue/blob/01b1830ee07cbafd15e5558f3a7e58b59143c4fa/.github/workflows/build-one-recipe.yml

name: Image Builder
description: Build, push, and sign container images with SLSA-ready outputs
inputs:
  image-name:
    description: Name of the image
    type: string
    required: true
  containerfile:
    description: Path to the Containerfile
    type: string
    required: true
  context:
    description: Build context directory
    type: string
    required: false
    default: .
  platform:
    description: Target platform (e.g., linux/amd64)
    type: string
    required: true
  slsa-verify-source:
    description: Optional source URI for SLSA verification
    type: string
    required: false
    default: ''
  signing-secret:
    description: The cosign private key for signing
    type: string
    required: true
  registry:
    description: The registry to push to
    type: string
    required: false
    default: ghcr.io

outputs:
  full-image-ref:
    description: The full image reference with tag
    value: ${{ steps.build_image.outputs.image-with-tag }}
  image-digest:
    description: The image digest
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
  - name: Maximize build space
    uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be   # v1.3.1
    with:
      tool-cache: true
      android: true
      dotnet: true
      haskell: true
      large-packages: false
      docker-images: false
      swap-storage: true

  - name: Install slsa-verifier
    if: ${{ inputs.slsa-verify-source != '' }}
    uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6   # v2.7.1

  - name: Verify base image provenance
    shell: bash
    if: ${{ inputs.slsa-verify-source != '' }}
    env:
      CONTAINERFILE: ${{ inputs.containerfile }}
      SOURCE_URI: ${{ inputs.slsa-verify-source }}
    run: |
      set -exuo pipefail

      # Install crane
      CRANE_VERSION=v0.20.7
      CRANE_OS=Linux
      CRANE_ARCH=x86_64
      CRANE_BASE="https://github.com/google/go-containerregistry/releases/download"
      CRANE_FILE="go-containerregistry_${CRANE_OS}_${CRANE_ARCH}.tar.gz"
      curl -fLsS --retry 5 \
        -o 'go-containerregistry.tar.gz' \
        "${CRANE_BASE}/${CRANE_VERSION}/${CRANE_FILE}" \
        -o 'provenance.intoto.jsonl' \
        "${CRANE_BASE}/${CRANE_VERSION}/multiple.intoto.jsonl"
      slsa-verifier verify-artifact go-containerregistry.tar.gz \
        --provenance-path provenance.intoto.jsonl \
        --source-uri github.com/google/go-containerregistry \
        --source-tag "${CRANE_VERSION}"
      tar -zxvf go-containerregistry.tar.gz -C /usr/local/bin/ crane

      BASE_IMAGE=${BASE_IMAGE:-$(grep -P '^FROM ([a-z.-]+(/|:\w+))+' ${CONTAINERFILE} | cut -d ' ' -f 2)}
      DIGEST=$(crane digest "${BASE_IMAGE}")
      slsa-verifier verify-image --source-uri $SOURCE_URI "${BASE_IMAGE}@${DIGEST}"

  - name: Cache podman
    uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae   # v5.0.5
    with:
      path: ~/.local/share/containers
      key: podman

  - name: Extract metadata (tags, labels) for Docker
    id: meta
    uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf   # v6.0.0
    with:
      images: ${{ inputs.registry }}/${{ inputs.image-name }}
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value={{branch}}-{{sha}},enable=${{ github.event_name != 'pull_request' }}
        type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}},enable=${{ github.event_name != 'pull_request' }}
      labels: |
        org.opencontainers.image.created={{date 'YYYYMMDD-HHmmss'}}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.containerfile }}
        org.opencontainers.image.vendor=${{ github.repository_owner }}
        org.opencontainers.image.url=${{ github.event.repository.html_url }}
        org.opencontainers.image.revision=${{ github.sha }}

  - name: Build Image
    id: build_image
    uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056   # v2.13
    with:
      containerfiles: ${{ inputs.containerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platform }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      oci: true
      layers: true

  - name: Push To Registry
    id: push
    if: github.event_name != 'pull_request'
    uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c   # v2.8
    with:
      image: ${{ steps.build_image.outputs.image }}
      tags: ${{ steps.build_image.outputs.tags }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  - name: Log in to the Container registry
    if: github.event_name != 'pull_request'
    uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121   # v4.1.0
    with:
      registry: ${{ inputs.registry }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  - name: Install cosign
    if: github.event_name != 'pull_request'
    uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
    with:
      cosign-release: v3.0.6

  - name: Sign container image
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
      DIGEST: ${{ steps.push.outputs.digest }}
      COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
    run: |
      images=""
      for tag in $(echo "${TAGS}"); do
        images+="${tag}@${DIGEST} "
      done
      cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY ${images}

  - name: Verify container image  
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
    run: |
      images=""
      for tag in $(echo "${TAGS}"); do
        images+="${tag} "
      done
      cosign verify --key cosign.pub ${images}

  - name: Echo outputs
    shell: bash
    run: |
      echo "${{ toJSON(steps.push.outputs) }}"
