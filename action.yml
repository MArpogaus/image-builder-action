# References:
# https://github.com/ublue-os/image-template/blob/30dd5f507fdd88236775ccb4e3a7f719c01675b1/.github/workflows/build.yml
# https://github.com/secureblue/secureblue/blob/01b1830ee07cbafd15e5558f3a7e58b59143c4fa/.github/workflows/build-one-recipe.yml

name: Image Builder
description: Build, push, and sign container images with SLSA-ready outputs
inputs:
  image-name:
    description: Name of the image
    type: string
    required: true
  containerfile:
    description: Path to the Containerfile
    type: string
    required: true
  context:
    description: Build context directory
    type: string
    required: false
    default: .
  platform:
    description: Target platform (e.g., linux/amd64)
    type: string
    required: true
  slsa-verify-source:
    description: Optional source URI for SLSA verification
    type: string
    required: false
    default: ''
  signing-secret:
    description: The cosign private key for signing
    type: string
    required: true
  registry:
    description: The registry to push to
    type: string
    required: false
    default: ghcr.io/${{ github.repository_owner }}
  free-disk-space:
    description: Maximize build space
    type: bool
    required: false
    default: true
  cosign-public-key:
    description: Public key content or URL to verify the base image cosign signature
    type: string
    required: false
    default: ''
  build-args:
    description: Build arguments to pass to the container build (newline-separated KEY=VALUE)
    type: string
    required: false
    default: ''
  overwrite-ref-tag:
    description: Replace {{branch}} in auto-generated tags with this value (e.g., '31' → ':31', ':31-<sha>')
    type: string
    required: false
    default: ''

outputs:
  full-image-ref:
    description: The full image reference with tag
    value: ${{ steps.build_image.outputs.image-with-tag }}
  image-digest:
    description: The image digest
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
  - name: Maximize build space
    if: ${{ inputs.free-disk-space == 'true' }}
    uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be   # v1.3.1
    with:
      tool-cache: true
      android: true
      dotnet: true
      haskell: true
      large-packages: false
      docker-images: false
      swap-storage: true

  - name: Install slsa-verifier
    if: ${{ inputs.slsa-verify-source != '' }}
    uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6   # v2.7.1

  - name: Install crane and resolve base image
    id: resolve-base
    if: ${{ inputs.slsa-verify-source != '' || inputs.cosign-public-key != '' }}
    shell: bash
    env:
      CONTAINERFILE: ${{ inputs.containerfile }}
      BUILD_ARGS: ${{ inputs.build-args }}
    run: |
      set -exuo pipefail

      # Install crane
      CRANE_VERSION=v0.20.7
      CRANE_OS=Linux
      CRANE_ARCH=x86_64
      CRANE_BASE="https://github.com/google/go-containerregistry/releases/download"
      CRANE_FILE="go-containerregistry_${CRANE_OS}_${CRANE_ARCH}.tar.gz"
      curl -fLsS --retry 5 \
        -o 'go-containerregistry.tar.gz' \
        "${CRANE_BASE}/${CRANE_VERSION}/${CRANE_FILE}" \
        -o 'provenance.intoto.jsonl' \
        "${CRANE_BASE}/${CRANE_VERSION}/multiple.intoto.jsonl"
      if command -v slsa-verifier &>/dev/null; then
        slsa-verifier verify-artifact go-containerregistry.tar.gz \
          --provenance-path provenance.intoto.jsonl \
          --source-uri github.com/google/go-containerregistry \
          --source-tag "${CRANE_VERSION}"
      fi
      tar -zxvf go-containerregistry.tar.gz -C /usr/local/bin/ crane

      # Find the last non-scratch FROM to get the base image
      RAW_BASE=$(grep -E '^FROM\s+' "${CONTAINERFILE}" | grep -vE '\bscratch\b' | tail -1 | awk '{print $2}')
      if [ -z "$RAW_BASE" ]; then
        echo "No base image found to verify" >&2
        exit 1
      fi

      # Resolve build args in FROM (e.g., ${BASE_IMAGE} or $BASE_IMAGE)
      if [ -n "${BUILD_ARGS}" ]; then
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          RAW_BASE="${RAW_BASE//\$\{$key\}/$value}"
          RAW_BASE="${RAW_BASE//\$$key/$value}"
        done <<< "${BUILD_ARGS}"
      fi

      # Resolve immutable digest and persist for downstream steps
      DIGEST=$(crane digest "${RAW_BASE}")
      echo "BASE_TAG=${RAW_BASE}" >> "${GITHUB_ENV}"
      echo "BASE_DIGEST=${DIGEST}" >> "${GITHUB_ENV}"

  - name: Install cosign
    if: github.event_name != 'pull_request' || inputs.cosign-public-key != ''
    uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

  - name: Cosign verify base image
    if: ${{ inputs.cosign-public-key != '' }}
    shell: bash
    env:
      COSIGN_PUBLIC_KEY: ${{ inputs.cosign-public-key }}
    run: |
      set -exuo pipefail

      if echo "${COSIGN_PUBLIC_KEY}" | grep -qE '^https?://'; then
        cosign verify --key "${COSIGN_PUBLIC_KEY}" "${BASE_TAG}@${BASE_DIGEST}"
      else
        echo "${COSIGN_PUBLIC_KEY}" > /tmp/cosign.pub
        cosign verify --key /tmp/cosign.pub "${BASE_TAG}@${BASE_DIGEST}"
      fi

  - name: SLSA verify base image
    if: ${{ inputs.slsa-verify-source != '' }}
    shell: bash
    env:
      SOURCE_URI: ${{ inputs.slsa-verify-source }}
    run: |
      set -exuo pipefail

      slsa-verifier verify-image --source-uri "${SOURCE_URI}" "${BASE_TAG}@${BASE_DIGEST}"

  - name: Build tag list for metadata action
    id: tags
    shell: bash
    env:
      OVERWRITE_REF_TAG: ${{ inputs.overwrite-ref-tag }}
    run: |
      TAGS=$(
      cat <<-'TAGEOF'
      type=ref,event=branch
      type=ref,event=pr
      type=semver,pattern={{version}}
      type=semver,pattern={{major}}.{{minor}}
      type=raw,value=latest,enable={{is_default_branch}}
      type=raw,value={{branch}}-{{sha}},enable=${{ github.event_name != 'pull_request' }}
      type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}},enable=${{ github.event_name != 'pull_request' }}
      TAGEOF
      )

      ORT="${OVERWRITE_REF_TAG}"
      if [ -n "${ORT}" ]; then
        TAGS=$(echo "${TAGS}" \
          | sed "s|type=ref,event=branch|type=raw,value=${ORT}|" \
          | sed "s/{{branch}}/${ORT}/g")
      fi

      delimiter="TAGS_EOF_$(date +%s)"
      {
        echo "tags<<${delimiter}"
        echo "${TAGS}"
        echo "${delimiter}"
      } >> "${GITHUB_OUTPUT}"

  - name: Cache podman
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
    with:
      path: ~/.local/share/containers
      key: podman

  - name: Extract metadata (tags, labels) for Docker
    id: meta
    uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
    with:
      images: ${{ inputs.registry }}/${{ inputs.image-name }}
      tags: ${{ steps.tags.outputs.tags }}
      labels: |
        org.opencontainers.image.created={{date 'YYYYMMDD-HHmmss'}}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.containerfile }}
        org.opencontainers.image.vendor=${{ github.repository_owner }}
        org.opencontainers.image.url=${{ github.event.repository.html_url }}
        org.opencontainers.image.revision=${{ github.sha }}

  - name: Build Image
    id: build_image
    uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034   # v3.1.0
    with:
      containerfiles: ${{ inputs.containerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platform }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      build-args: ${{ inputs.build-args }}
      oci: true
      layers: true

  - name: Push To Registry
    id: push
    if: github.event_name != 'pull_request'
    uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37   # v3.0.0
    with:
      image: ${{ steps.build_image.outputs.image }}
      tags: ${{ steps.build_image.outputs.tags }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  - name: Log in to the Container registry
    if: github.event_name != 'pull_request'
    uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
    with:
      registry: ${{ inputs.registry }}
      username: ${{ github.actor }}
      password: ${{ github.token }}

  - name: Sign container image
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
      DIGEST: ${{ steps.push.outputs.digest }}
      COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
    run: |
      set -exuo pipefail

      images=""
      for tag in $(echo "${TAGS}"); do
        images+="${tag}@${DIGEST} "
      done
      cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY ${images}

  - name: Verify container image
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      TAGS: ${{ steps.meta.outputs.tags }}
    run: |
      set -exuo pipefail

      images=""
      for tag in $(echo "${TAGS}"); do
        images+="${tag} "
      done
      cosign verify --key cosign.pub ${images}

  - name: Echo outputs
    shell: bash
    run: |
      echo "${{ toJSON(steps.push.outputs) }}"
