# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

rules:
# The self-pin names the commit the release tag sits on top of, so its version
# comment can never match a tag object. README.md, "Security", says why the pin
# is a SHA rather than `./`.
- ignore: true
  conditions:
  - expr: |
      ActionName matches "^MArpogaus/image-builder-action"
# cosign-installer stays on its v3 line: with v4 the signature does not reach
# GHCR and `cosign verify` fails. README.md, "Security", has the rest.
- ignore: true
  conditions:
  - expr: |
      ActionName == "sigstore/cosign-installer"
# SLSA generator: tag, not SHA; see the provenance job in
# reusable-build-and-publish-one-image.yml.
- ignore: true
  conditions:
  - expr: |
      ActionName matches "slsa-framework/slsa-github-generator/.*" && ActionVersion matches "v\\d+\\.\\d+\\.\\d+"
