# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

rules:
# SLSA generator: tag, not SHA; see the provenance job in
# reusable-build-and-publish-one-image.yml.
- ignore: true
  conditions:
  - expr: |
      ActionName matches "slsa-framework/slsa-github-generator/.*" && ActionVersion matches "v\\d+\\.\\d+\\.\\d+"
