name: Build and test container images

on:
  pull_request:
  push:
    branches: [main, dev]
  # No branch filter on the trigger, so the publishing jobs below gate on the
  # ref instead: a dispatch against any branch would otherwise publish and sign
  # with the real key.
  #
  # The jobs that a pull request reaches get an empty signing key, not the real
  # one. They run the action from the pull request's own head (`uses: ./`, and
  # a reusable workflow also resolves against that ref), so the `if:` that
  # holds the signing step back lives in a file the pull request can edit. A
  # branch in this repository carries the repository's secrets, so this is the
  # only gate that a pull request cannot move.
  workflow_dispatch:

permissions: {}

jobs:
  build-basic:
    if: github.ref_name == 'main' || github.ref_name == 'dev' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-and-publish-one-image.yml
    with:
      image-name: test-basic
      containerfile: ./examples/Containerfile.basic
      context: .
      platform: linux/amd64
      free-disk-space: false
    secrets:
      SIGNING_SECRET: ${{ github.event_name != 'pull_request' && secrets.SIGNING_SECRET || '' }}

  # `uses: ./` so this job runs the action as it is in this commit. The
  # reusable workflow pins the action by SHA for consumers, so a job that went
  # through it would test the last released action instead of this one.
  build-derived:
    if: github.ref_name == 'main' || github.ref_name == 'dev' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
    - uses: ./
      with:
        image-name: test-derived
        containerfile: ./examples/Containerfile.derived
        context: .
        platform: linux/amd64
        build-args: BASE_IMAGE=ghcr.io/ublue-os/arch-toolbox:latest
        cosign-public-key: https://raw.githubusercontent.com/ublue-os/main/main/cosign.pub
        free-disk-space: false
        signing-secret: ${{ github.event_name != 'pull_request' && secrets.SIGNING_SECRET || '' }}

  test-slsa:
    needs: [build-basic]
    if: >-
      github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'dev')
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build-and-publish-one-image.yml
    with:
      image-name: test-slsa
      containerfile: ./examples/Containerfile.slsa
      context: .
      platform: linux/amd64
      build-args: BASE_IMAGE=ghcr.io/marpogaus/test-basic:${{ github.ref_name }}
      slsa-verify-source: github.com/MArpogaus/image-builder-action
      free-disk-space: false
    secrets:
      SIGNING_SECRET: ${{ github.event_name != 'pull_request' && secrets.SIGNING_SECRET || '' }}

  # `uses: ./`, for the same reason as build-derived.
  build-overwrite-tag:
    if: github.ref_name == 'main' || github.ref_name == 'dev' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
    - uses: ./
      with:
        image-name: test-overwrite
        containerfile: ./examples/Containerfile.basic
        context: .
        platform: linux/amd64
        overwrite-ref-tag: test
        free-disk-space: false
        signing-secret: ${{ github.event_name != 'pull_request' && secrets.SIGNING_SECRET || '' }}
