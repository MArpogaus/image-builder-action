name: Build and test container images

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        include:
        - name: basic
          containerfile: ./examples/Containerfile.basic
          build-args: ''
          cosign-key: ''
        - name: derived
          containerfile: ./examples/Containerfile.derived
          build-args: BASE_IMAGE=ghcr.io/ublue-os/arch-toolbox:latest
          cosign-key: https://raw.githubusercontent.com/ublue-os/main/main/cosign.pub
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

    - name: Build and Push Image
      id: build
      uses: ./ # Uses the action.yml in the root of this repo
      with:
        image-name: test-${{ matrix.name }}
        containerfile: ${{ matrix.containerfile }}
        context: .
        platform: linux/amd64
        build-args: ${{ matrix.build-args }}
        cosign-public-key: ${{ matrix.cosign-key }}
        signing-secret: ${{ secrets.SIGNING_SECRET }}
        free-disk-space: false


